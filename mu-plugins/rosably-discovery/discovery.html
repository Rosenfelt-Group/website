<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Discovery — Rosably</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --accent: #C05621; --bg: #1A1A1A; --card: #2A2A2C; --border: #3D3D3F;

  }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  button, input, textarea, select { font-family: inherit; font-size: inherit; color: inherit; }

  .shell { width: 100%; max-width: 720px; }
  .brand { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; font-size: .85rem; color: var(--muted); }
  .brand b { color: var(--text); font-size: 1rem; letter-spacing: .02em; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 28px 24px; }

  h2 { font-size: 1.35rem; font-weight: 700; line-height: 1.3; }
  .muted { color: var(--muted); }
  .small { font-size: .85rem; }
  .intro { color: var(--muted); margin: 6px 0 24px; }
  .brief { background: var(--bg); border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: 10px; padding: 16px 18px; margin: 0 0 24px; white-space: pre-wrap; font-size: .93rem; color: #E8E6E0; max-height: 280px; overflow: auto; }

  .progress > div { height: 100%; background: var(--accent); transition: width .3s; }
  .meta { display: flex; justify-content: space-between; font-size: .8rem; color: var(--muted); margin-bottom: 18px; }
  .field { margin-bottom: 26px; }
  .label { display: block; font-weight: 600; margin-bottom: 4px; }
  .req { color: var(--accent); margin-left: 3px; }

  input:focus, textarea:focus, select:focus { border-color: var(--accent); }

  .opt { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; cursor: pointer;
    background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin-bottom: 8px;
    font-size: .95rem; transition: background .15s, border-color .15s; }
  .opt:hover { border-color: #5a5a5c; }
  .opt.on { background: rgba(192,86,33,.14); border-color: var(--accent); }
  .opt:disabled { opacity: .45; cursor: not-allowed; }

  .dot.sq { border-radius: 5px; }
  .on .dot { background: var(--accent); border-color: var(--accent); }
  .grid2 { display: grid; grid-template-columns: 1fr; gap: 0 8px; }
  @media (min-width: 600px) { .grid2 { grid-template-columns: 1fr 1fr; } }

  .chips .dot { flex-basis: 16px; height: 16px; font-size: 10px; }
  .scale { display: flex; gap: 8px; }

  .scale button.on { background: var(--accent); border-color: var(--accent); }
  .scale-labels { display: flex; justify-content: space-between; font-size: .8rem; color: var(--muted); margin-top: 6px; }
  .row { border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 10px; background: var(--bg); }

  .link.muted { color: var(--muted); font-weight: 500; }

  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .save-state { font-size: .8rem; color: var(--muted); }
  .center { text-align: center; }
  .spin { width: 28px; height: 28px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 14px; }

  .yesno { display: flex; gap: 8px; }

  .followup { margin-top: 12px; }
  .followup label { display: block; font-size: .9rem; margin-bottom: 6px; }
</style>

    var d = state.data, sections = d.questionnaire.sections;
    var first = (d.contact_name || "").split(" ")[0];

    if (idx === -1) {
      var resuming = state.resumeAt > 0;
      return h("div", { className: "shell" }, header, h("div", { className: "card" },
        h("h1", null, (first ? "Hi " + first + " — " : "") + "let's get ready for our first call"),
        h("p", { className: "intro", style: { marginTop: 12, whiteSpace: "pre-wrap" } },
          d.questionnaire.intro
            ? d.questionnaire.intro
            : DEFAULT_INTRO + " It takes about " + d.questionnaire.estimated_minutes + " minutes and saves as you go, so you can stop and come back with the same link."),
        h("p", { className: "small muted", style: { marginBottom: 6 } }, "Project"),
        h("p", { style: { fontWeight: 600, marginBottom: 20 } }, d.project_title),
        h("ul", { className: "steps" }, sections.map(function (s, i) {
          var done = missingIn(s, answers).length === 0 && s.fields.some(function (f) { return !isEmpty(answers[f.id]); });
          return h("li", { key: s.id }, h("span", null, (i + 1) + ". " + s.title), done ? h("span", { className: "check" }, "✓") : null);
        })),
        h("div", { className: "nav", style: { borderTop: "none", paddingTop: 0 } },
          h("span", { className: "small muted" }, "Your answers are only shared with Rosably."),
          h("button", { className: "btn primary", onClick: function () { go(resuming ? state.resumeAt : 0); } }, resuming ? "Pick up where you left off" : "Start"))));
    }

    var s = sections[idx];
    var pct = Math.round((idx / sections.length) * 100);
    var isLast = idx === sections.length - 1;

    return h("div", { className: "shell" }, header,
      h("div", { className: "progress" }, h("div", { style: { width: pct + "%" } })),
      h("div", { className: "meta" }, h("span", null, "Section " + (idx + 1) + " of " + sections.length), h("span", { className: "save-state", "aria-live": "polite" }, saveState)),
      h("div", { className: "card" },
        h("h2", null, s.title),
        s.intro ? h("p", { className: "intro" }, s.intro) : null,
        d.project_brief && (s.id === "project" || (idx === 0 && !sections.some(function (x) { return x.id === "project"; })))
          ? h("div", { className: "brief" }, d.project_brief) : null,
        s.fields.filter(function (f) { return isVisible(f, answers); }).map(function (f) {
          return h(Field, { key: f.id, field: f, value: answers[f.id], answers: answers, setAnswer: setAnswer, error: errors.indexOf(f.id) !== -1 });
        }),
        errors.length ? h("p", { className: "err", style: { marginBottom: 12 } }, "Please answer the highlighted questions to continue.") : null,
        h("div", { className: "nav" },
          h("button", { className: "btn", onClick: function () { go(idx - 1); } }, "Back"),
          h("button", { className: "btn primary", disabled: busy, onClick: function () { next(sections); } },
            busy ? "Submitting…" : isLast ? (PREVIEW ? "Submit (off in preview)" : "Submit") : "Continue"))));
  }

  ReactDOM.createRoot(document.getElementById("root")).render(h(App));
})();
</script>
</body>
</html>
